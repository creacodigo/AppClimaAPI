<!doctype html>
<html lang="es">
  <head>
    <!-- Junior Programmer - Projecto Biblia HTML CSS JS con conexion a API-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bible App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f4f7;
        margin: 0;
      }
      .container {
        background-color: #ffffff;
        padding: 2em;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 90%;
        max-width: 500px;
      }
      h1 {
        color: #333;
        margin-bottom: 1em;
      }
      .input-group {
        margin-bottom: 1em;
      }
      .input-group input {
        padding: 0.8em;
        border: 1px solid #ddd;
        border-radius: 5px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 0.5em;
      }
      button {
        padding: 0.8em 1.5em;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
      }
      button:hover {
        background-color: #0056b3;
      }
      #weather-info {
        margin-top: 1.5em;
        text-align: left;
        border-top: 1px solid #eee;
        padding-top: 1.5em;
      }
      #weather-info h2 {
        color: #555;
        margin: 0;
      }
      #weather-info p {
        margin: 0.5em 0;
        color: #666;
      }
      p {
        text-align: justify;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Biblia en linea</h1>
      <div class="input-group">
        <input
          type="text"
          id="verseInput"
          placeholder="Escribe la cita Biblica (Ej. John 3:16)"
        />
      </div>
      <button id="getReferenceBtn">Buscar</button>
      <div id="verse-info">
        <!-- Aqui se presentaran los datos de la cita despues de obtener la info de la API-->
      </div>
    </div>

    <script>
      // *** No necesitas una llave de API para este proyecto *__*
      const verseInput = document.getElementById("verseInput");
      const getReference = document.getElementById("getReferenceBtn");
      const verseDiv = document.querySelector("#verse-info");

      //Event Listener o sensor de evento
      getReference.addEventListener("click", () => {
        //console.log("Prueba del evento click :)");
        const verse = verseInput.value;

        if (verse.trim() === "") {
          alert("Por favor, ingresa el nombre de una referencia. Ej: Gen 1:1");
          return;
        }
        //EndPoint
        const API_URL = `https://bible-api.com/${encodeURIComponent(verse)}?translation=kjv`;

        //Llamada a la API
        fetch(API_URL)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Error ${response.status}: Cita no encontrada.`);
            }
            return response.json();
          })
          .then((data) => {
            displayVerse(data);
          })
          .catch((error) => {
            verseDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
          });
      });

      //funcion de salida
      function displayVerse(data) {
        //console.log("Prueba de la funcion displayVerse");
        const reference = data.reference;
        const verses = data.verses.map((v) => v.verse + " " + v.text).join(" ");

        verseDiv.innerHTML = `
        <h2>Referencia ${reference}</h2>
        <p><strong>Descripción:</strong> ${verses}</p>`;
      }
    </script>
  </body>
</html>
